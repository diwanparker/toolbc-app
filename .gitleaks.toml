title = "ToolBC gitleaks rules"

[[rules]]
id = "google-api-key"
description = "Google/Gemini API key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["key", "google", "gemini"]

[[rules]]
id = "supabase-service-role"
description = "Supabase service role key value"
regex = '''(?i)(SUPABASE_SERVICE_ROLE_KEY|service_role)\s*[:=]\s*["']?(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)'''
tags = ["key", "supabase"]
